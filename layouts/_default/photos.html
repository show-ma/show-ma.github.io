{{ define "main" }}

<div class="button-group">
    <button class="filter-button" data-category="-">&nbsp;All&nbsp;</button>
    <button class="filter-button" data-category="home">#北京</button>
    <button class="filter-button" data-category="nyc">#纽约</button>
    <button class="filter-button" data-category="fl">#Florida</button>
    <button class="filter-button" data-category="art">#艺术</button>
</div>

<style>
.gallery-photos {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
  }
  
  .gallery-photo {
    width: 24.9%;
    position: relative;
    transition: opacity 0.5s ease;
    overflow: hidden;
    box-sizing: border-box;
  }
  
  .gallery-photo img {
    width: 100%;
    padding: 4px;
    border-radius: 20px;
    cursor: pointer;
    transition: transform 0.4s ease-in-out;
  }
  
  .gallery-photo:hover img {
    transform: scale(1.1);
  }
  
  .photo-title, .photo-time {
    display: none;
    position: absolute;
    padding: 0 8px;
    font-size: 0.9rem;
    color: white;
    background: rgba(0,0,0,0.3);
  }
  
  .photo-title {
    bottom: 4px;
    left: 4px;
  }
  
  .photo-time {
    top: 4px;
    left: 4px;
  }
  
  .gallery-photo:hover .photo-title {
    display: block;
  }
  
  @media (max-width: 1280px) {
    .gallery-photo { width: 33.3%; }
  }
  
  @media (max-width: 860px) {
    .gallery-photo { width: 49.9%; }
  }
  
  @media (max-width: 683px) {
    .photo-time { display: none; }
  }
  
  .button-group {
  display: flex;
  gap: 18px;
  justify-content: center;
  margin: 1rem 0;
}

.filter-button {
  background-color: var(--card-background);
  color: #57bd8f;
  border: none;
  border-radius: 5px;
  padding: 8px 8px;
  cursor: pointer;
  transition: background-color 0.3s ease;
}

.filter-button:hover {
  color: #5e88f7;
}

.selected-button {
  background-color: #CCE8CF;
  color: #000;
}
</style>

<div class="gallery-photos page">
  {{ range (sort (readDir "./static/photos") "Name" "desc") }}
    {{ if ( .Name | findRE "\\.(gif|jpg|jpeg|tiff|png|bmp|webp|avif|jxl)") }}
    <div class="gallery-photo visible" data-alt="{{ .Name }}">
      <img class="photo-img" loading="lazy" decoding="async" src="/photos/{{ .Name }}">
      <span class="photo-title">{{ .Name | replaceRE "^[0-9 -]+(.*)[.].*" "$1" }}</span>
      <span class="photo-time">{{ .Name | replaceRE "^([0-9-]+).*[.].*" "$1" }}</span>
    </div>
    {{ end }}
  {{ end }}
</div>

<script src="https://immmmm.com/view-image.js" defer></script>
<script src="https://immmmm.com/waterfall.min.js" defer></script>
<script src="https://immmmm.com/imgStatus.min.js" defer></script>
<script src="https://immmmm.com/lately.min.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const rerunWaterfall = () => {
    waterfall('.gallery-photos');
    document.querySelectorAll('.gallery-photo').forEach(p => p.classList.add('visible'));
  };

  setTimeout(() => {
    imgStatus.watch('.photo-img', imgs => {
      if (imgs.isDone()) rerunWaterfall();
    });
  }, 100);

  window.addEventListener('resize', rerunWaterfall);
  window.Lately && Lately.init({ target: '.photo-time' });
  window.ViewImage && ViewImage.init('.gallery-photo img');

  const filterButtons = document.querySelectorAll('.filter-button');
  filterButtons.forEach(button => {
    button.addEventListener('click', () => {
      const category = button.dataset.category;
      document.querySelectorAll('.gallery-photo').forEach(photo => {
        const name = photo.dataset.alt;
        photo.style.display = category === '-' || name.includes(category) ? 'block' : 'none';
      });
      filterButtons.forEach(b => b.classList.remove('selected-button'));
      button.classList.add('selected-button');
      rerunWaterfall();
    });
  });
});
</script>
{{ end }}
