[[messages]]
text = "没人评论？那你来当真相的第一名目击者吧。\n<span class=\"disco-purple\">争强好胜</span><span class=\"disco-grey\">[中等：成功]</span> — 你是第一个到场的人。别浪费这个机会。"

[[messages]]
text = "你盯着空白评论框。它像马丁内斯冬日的海——无波，无声，也无望。\n<span class=\"disco-purple\">平心定气</span><span class=\"disco-grey\">[普通：成功]</span> — 这只是互联网的一页。它不会咬你。你能活着离开它，不必留下任何话。"

[[messages]]
text = "这里曾有一次请求响应，但你来得太迟了。\n<span class=\"disco-pink\">天人感应</span><span class=\"disco-grey\">[困难：成功]</span> — 服务器梦见了人类，梦见了他们分享、评论、点赞……然后一觉醒来，只有你。"

[[messages]]
text = "这段HTML已经三天没有变化了。你能感受到它的饥饿。\n<span class=\"disco-blue\">博学多闻</span><span class=\"disco-grey\">[中等：成功]</span> — “wl”曾经在旧时指代“Wanting Line”，一个期盼链接的终端接口。但没人再记得这一层隐喻了。"

[[messages]]
text = "没有评论。也没有证人。完美的不在场证明。\n<span class=\"disco-yellow\">鬼祟玲珑</span><span class=\"disco-grey\">[普通：成功]</span> — “离开这里。”它对你说，“装作你没来过。”"

[[messages]]
text = "这里是数字的沙漠，回音只是你自己的想法来回反弹。\n<span class=\"disco-blue\">逻辑思维</span><span class=\"disco-grey\">[普通：成功]</span> — “如果一个页面从未被评论，它是否存在过？”你脑中响起这个问题。"

[[messages]]
text = "点进来的人都在想同一个问题：“有人敢先说点什么吗？”\n<span class=\"disco-purple\">争强好胜</span><span class=\"disco-grey\">[普通：失败]</span> — 你试图开口，却感觉像在厕所里高声朗诵诗歌——一种无法忍受的裸露感把你打回原地。"

[[messages]]
text = "页面很干净，就像被处理过的犯罪现场。\n<span class=\"disco-blue\">见微知著</span><span class=\"disco-grey\">[中等：成功]</span> — 你看见了留言按钮旁多余的一像素偏移，像是某种数字上的血迹。"

[[messages]]
text = "你已经连接上服务器，但你没连上任何人。\n<span class=\"disco-yellow\">能工巧匠</span><span class=\"disco-grey\">[困难：成功]</span> — 你检查协议日志，一切都运行正常……这才是最糟糕的。"

[[messages]]
text = "欢迎光临“被动式交流艺术装置”。\n<span class=\"disco-blue\">标新立异</span><span class=\"disco-grey\">[中等：成功]</span> — “空白就是形式。”你低语，仿佛你是这个荒谬美学装置的一部分。也许你是。"